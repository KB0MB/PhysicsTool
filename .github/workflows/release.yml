name: Build release candidates
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        default: '2.0'
        required: true
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: ubuntu-24.04, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-15, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_RID: ${{ matrix.rid }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native model decoder
        shell: pwsh
        run: |
          $arguments = @('-S', 'PhysicsTool/ThirdParty/MeshCodec', '-B', 'artifacts/native', '-DCMAKE_BUILD_TYPE=Release')
          if ($IsWindows) { $arguments += @('-A', $(if ($env:RELEASE_RID -eq 'win-arm64') { 'ARM64' } else { 'x64' })) }
          cmake @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build artifacts/native --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install artifacts/native --config Release --prefix "PhysicsTool/ThirdParty/MeshCodec/runtimes/$env:RELEASE_RID"
          exit $LASTEXITCODE
      - name: Build and test
        shell: pwsh
        run: |
          dotnet build PhysicsTool.slnx -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/PhysicsTool.Checks -c Release --no-build -- artifacts/checks
          exit $LASTEXITCODE
      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION -Runtimes $env:RELEASE_RID
      - uses: actions/upload-artifact@v4
        with:
          name: PhysicsTool-${{ inputs.version }}-${{ matrix.rid }}
          path: artifacts/releases/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.rid }}
          path: artifacts/checks/*.png
